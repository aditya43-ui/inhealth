; inhealtcare/php-fpm.conf
[global]
; Logging
error_log = /var/log/php-fpm.log
log_level = notice
[www]
user = www-data
group = www-data
; Listen untuk Docker networking
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35

; Session configuration - CRITICAL for Yii login
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_value[session.gc_maxlifetime] = 1440
php_admin_value[session.cookie_lifetime] = 0
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 0
php_admin_value[session.use_cookies] = 1
php_admin_value[session.use_only_cookies] = 1
php_admin_value[session.name] = PHPSESSID
php_admin_value[session.save_handler] = files

; Security settings - reduce header size
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php_errors.log
php_admin_value[html_errors] = Off