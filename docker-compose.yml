services:
  # Service untuk Nginx (Web Server)
  nginx:
    image: nginx:alpine
    container_name: inhealtcare-nginx
    ports:
      - "9090:80" # Akses aplikasi di http://localhost:9090
    volumes:
      - .:/var/www/html # Mount seluruh kode aplikasi ke container
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Mount konfigurasi nginx kustom
      - ./nginx-cache:/var/cache/nginx
      - php-socket:/var/run/php
      - php-sessions:/var/lib/php/sessions
    depends_on:
      - php
    networks:
      - yii-network

  # Service untuk PHP-FPM (Application Server)
  php:
    build:
      context: . # Build dari Dockerfile di direktori saat ini (root proyek)
      dockerfile: Dockerfile
    container_name: inhealtcare-php
    volumes:
      - .:/var/www/html # Mount seluruh kode aplikasi ke container
      - php-socket:/var/run/php
      - php-sessions:/var/lib/php/sessions
    environment:
      - PHP_SESSION_SAVE_PATH=/var/lib/php/sessions
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-inhealth}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-rss@j@y@2025}
    env_file:
      - path: .env
        required: false
    depends_on:
      - db
    networks:
      - yii-network

  # Service untuk PostgreSQL Database (Lokal / Standalone)
  db:
    image: postgres:14-alpine
    container_name: inhealtcare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inhealth}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-rss@j@y@2025}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - yii-network

volumes:
  php-socket: # Definisikan volume bersama untuk socket
  php-sessions: # Volume untuk session files
  pgdata: # Volume persisten untuk data PostgreSQL

networks:
  yii-network:
    driver: bridge