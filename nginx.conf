server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Fix untuk session cookies Yii dan large headers
    large_client_header_buffers 4 32k;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 16 32k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    
    # Fix untuk upstream too big header
    proxy_buffer_size 64k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 128k;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
        add_header Cache-Control "public, immutable";
    }

    # Lokasi untuk permintaan PHP - FIX UNTUK SESSION
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # CRITICAL: Fix untuk session Yii
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $https if_not_empty;
        
        # Buffer settings untuk stabilitas
        fastcgi_buffer_size 128k;  # Naikkan dari 32k ke 128k
        fastcgi_buffers 4 256k;    # Sesuaikan buffers
        fastcgi_busy_buffers_size 256k;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
        # Fix untuk Yii pretty URLs
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?r=$1 last;
        }
    }

    location ~ ^/(protected|framework|themes/\w+/views)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}